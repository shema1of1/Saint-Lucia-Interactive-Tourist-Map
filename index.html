<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Saint Lucia Interactive Tourist Map"><title>Saint Lucia Interactive Tourist Map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="app-header"><div><div class="eyebrow">SAINT LUCIA</div><h1>Interactive Tourist Map</h1></div><button id="locateBtn" class="header-button" type="button">◎ My location</button></header>
<main id="map" aria-label="Saint Lucia interactive map"></main>
<aside class="map-key" aria-label="Map key"><div class="key-title">Map Key</div><button class="key-item" data-category="Beauty"><img class="key-thumb" src="assets/icons/beauty-barber.png" alt=""><span>Beauty</span></button><button class="key-item" data-category="Events"><img class="key-thumb" src="assets/icons/events.png" alt=""><span>Events</span></button><button class="key-item" data-category="Food"><img class="key-thumb" src="assets/icons/restaurant.png" alt=""><span>Food</span></button><button class="key-item" data-category="Getting Around"><img class="key-thumb" src="assets/icons/transport-hub.png" alt=""><span>Getting Around</span></button><button class="key-item" data-category="Lodging"><img class="key-thumb" src="assets/icons/lodging.png" alt=""><span>Lodging</span></button><button class="key-item" data-category="Police Stations"><img class="key-thumb" src="assets/icons/police.png" alt=""><span>Police Stations</span></button></aside>
<div class="map-controls"><button id="resetBtn" type="button">⌂ Saint Lucia</button></div>
<div class="copyright-notice" aria-label="360MAP copyright">© 2026 360MAP</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="js/app.js"></script>
</body></html>
